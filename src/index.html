<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Galka Research Terminal</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="../terminal/vendor/lightweight-charts.standalone.production.js" defer></script>
  <script src="../terminal/vendor/jszip-3.10.1.min.js" defer></script>
</head>
<body>
  <header>
    <h1>Galka Research Terminal</h1>
    <label class="upload">Загрузить .galka.zip или .galka.json<input id="fileInput" type="file" accept=".zip,.json,.galka.zip,.galka.json" /></label>
  </header>
  <main>
    <aside>
      <section id="summary"><h2>Сводка</h2><p>Файл не загружен.</p></section>
      <section><h2>Сделки</h2><select id="tradeSelect" size="14"></select></section>
      <section id="tradeDetails"><h2>Детали сделки</h2></section>
    </aside>
    <section class="chart-wrap"><div id="chart"></div></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
