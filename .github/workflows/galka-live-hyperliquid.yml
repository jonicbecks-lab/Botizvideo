name: Galka Hyperliquid Live

on:
  push:
    branches:
      - main
      - agent/galka-live-hardening-v3
    paths:
      - '.githooks/**'
      - '.gitignore'
      - 'live/**'
      - 'terminal/live.*'
      - 'scripts/*galka-live*.sh'
      - 'scripts/check-live-*.mjs'
      - 'scripts/check-python-lock.py'
      - 'scripts/check-repository-secrets.py'
      - 'scripts/check-workflows.py'
      - 'scripts/test-installer-rollback.sh'
      - 'scripts/termux-sync-and-prepare-galka.sh'
      - 'scripts/test-termux-sync-and-prepare-galka.sh'
      - 'scripts/import-production-bundle.sh'
      - 'scripts/test-import-production-bundle.sh'
      - 'tests/test_*.py'
      - '.github/workflows/galka-live-hyperliquid.yml'
  pull_request:
    paths:
      - '.githooks/**'
      - '.gitignore'
      - 'live/**'
      - 'terminal/live.*'
      - 'scripts/*galka-live*.sh'
      - 'scripts/check-live-*.mjs'
      - 'scripts/check-python-lock.py'
      - 'scripts/check-repository-secrets.py'
      - 'scripts/check-workflows.py'
      - 'scripts/test-installer-rollback.sh'
      - 'scripts/termux-sync-and-prepare-galka.sh'
      - 'scripts/test-termux-sync-and-prepare-galka.sh'
      - 'scripts/import-production-bundle.sh'
      - 'scripts/test-import-production-bundle.sh'
      - 'tests/test_*.py'
      - '.github/workflows/galka-live-hyperliquid.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: live/requirements-termux.txt
      - run: python -m pip install packaging==26.2 pip==26.1.2 setuptools==83.0.0 wheel==0.47.0
      - run: python -m pip install -r live/requirements-termux.txt
      - run: python scripts/check-python-lock.py
      - run: python -m compileall -q live tests
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: python scripts/check-repository-secrets.py --history

  scripts-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: node --check terminal/live.js
      - run: node scripts/check-live-secret-isolation.mjs
      - run: node scripts/check-live-terminal.mjs
      - run: python3 scripts/check-workflows.py
      - run: bash scripts/test-installer-rollback.sh
      - run: bash scripts/test-termux-sync-and-prepare-galka.sh
      - run: bash scripts/test-import-production-bundle.sh
      - run: shellcheck -x scripts/*.sh .githooks/pre-commit
      - name: Validate shell entrypoints
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
