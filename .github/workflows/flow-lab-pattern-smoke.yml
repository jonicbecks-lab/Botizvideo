name: Flow Lab Pattern Smoke

on:
  push:
    branches:
      - research/multivenue-flow-btc-eth-v1
    paths:
      - 'research/flow_lab/collector.py'
      - 'research/flow_lab/micro_collector.py'
      - 'research/flow_lab/pattern_smoke.py'
      - 'research/flow_lab/window_replay.py'
      - 'research/flow_lab/catalog_study.py'
      - 'research/flow_lab/pattern_engine.py'
      - 'research/flow_lab/patterns.py'
      - 'research/flow_lab/online_response.py'
      - 'research/flow_lab/families.py'
      - '.github/workflows/flow-lab-pattern-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-lab-pattern-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/flow_lab/requirements.txt
      - name: Collect and synchronize public multi-venue feeds
        run: PYTHONPATH=. python -m research.flow_lab.pattern_smoke --duration-sec 150 --output-dir results/flow_lab/live-pattern-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-lab-live-pattern-smoke
          path: results/flow_lab/live-pattern-smoke
