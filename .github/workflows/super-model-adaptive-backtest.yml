name: SUPER Model Adaptive Backtest 2020-2025

on:
  push:
    branches:
      - research/super-model-adaptive-backtest-2020-2025-v2
    paths:
      - 'research/super_model_adaptive_backtest.py'
      - '.github/workflows/super-model-adaptive-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests tabulate
      - name: Run SUPER strategy backtest
        run: python research/super_model_adaptive_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-model-adaptive-backtest-results
          path: research/super_model_output/**
          if-no-files-found: warn
