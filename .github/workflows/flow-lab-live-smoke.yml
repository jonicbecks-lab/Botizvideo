name: Flow Lab Live Smoke

on:
  push:
    branches:
      - research/multivenue-flow-btc-eth-v1
    paths:
      - 'research/flow_lab/live_smoke.py'
      - 'research/flow_lab/collector.py'
      - 'research/flow_lab/micro_collector.py'
      - 'research/flow_lab/parsers.py'
      - 'research/flow_lab/book.py'
      - 'research/flow_lab/okx_metadata.py'
      - '.github/workflows/flow-lab-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-lab-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/flow_lab/requirements.txt
      - name: Probe public trade and book feeds
        run: python -m research.flow_lab.live_smoke --timeout-sec 15
