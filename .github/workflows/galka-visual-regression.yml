name: Galka visual regression

on:
  push:
    branches:
      - 'agent/**'
  pull_request:
    branches:
      - main
      - agent/galka-pro-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked visual test runtime
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify background paper recovery in Chromium
        run: node scripts/test-paper-recovery-browser.mjs
      - name: Verify offline legacy viewers in Chromium
        run: node scripts/test-legacy-viewers-browser.mjs
      - name: Prepare visual baseline
        run: |
          git fetch origin agent/galka-pro-redesign:refs/remotes/origin/agent/galka-pro-redesign
          git worktree add --detach /tmp/galka-base origin/agent/galka-pro-redesign
      - name: Capture before and after
        run: node scripts/capture-galka-visuals.mjs --current-root . --baseline-root /tmp/galka-base --output artifacts/galka-visuals
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: galka-visuals
          path: artifacts/galka-visuals/*.png
          if-no-files-found: error
