name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm run check
      - run: python3 scripts/check-workflows.py
      - run: python3 scripts/check-repository-secrets.py --history
      - run: shellcheck -x scripts/*.sh .githooks/pre-commit

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: live/requirements-termux.txt
      - run: python -m pip install packaging==26.2 pip==26.1.2 setuptools==83.0.0 wheel==0.47.0
      - run: python -m pip install -r live/requirements-termux.txt
      - run: python scripts/check-python-lock.py
      - run: python -m compileall -q live tests
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: bash scripts/test-installer-rollback.sh
      - name: Validate shell entrypoints
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  research-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: python -m pip install -r research/requirements.txt
      - run: npm run research:test
