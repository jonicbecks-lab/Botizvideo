name: RANGE LAB V1
on:
  workflow_dispatch:
  push:
    branches: [research/range-lab-v1]
    paths:
      - 'research/range_lab_train.py'
      - '.github/workflows/range-lab-v1.yml'
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests scikit-learn
      - run: python research/range_lab_train.py
      - uses: actions/upload-artifact@v4
        with:
          name: range-lab-v1
          path: research/range_lab_output/
          retention-days: 14
