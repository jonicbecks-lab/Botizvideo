name: Flow Lab Tests

on:
  push:
    branches:
      - research/multivenue-flow-btc-eth-v1
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/flow_lab/requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s research/flow_lab/tests -v
      - run: python -m py_compile research/flow_lab/*.py
