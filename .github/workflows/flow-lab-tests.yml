name: Flow Lab Tests

on:
  push:
    branches:
      - research/multivenue-flow-btc-eth-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-lab-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/flow_lab/requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s research/flow_lab/tests -v
      - run: python -m py_compile research/flow_lab/*.py
