name: Flow Lab Pilot Study

on:
  push:
    branches:
      - research/multivenue-flow-btc-eth-v1
    paths:
      - 'research/flow_lab/archive_study.py'
      - 'research/flow_lab/multi_day_study.py'
      - 'research/flow_lab/historical.py'
      - '.github/workflows/flow-lab-pilot-study.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-lab-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/flow_lab/requirements.txt
      - name: Run fixed one-day pilot
        run: >-
          python -m research.flow_lab.archive_study
          --date 2026-09-20
          --assets BTC ETH
          --window-sec 30
          --extreme-percentile 0.99
          --output results/flow_lab/pilot.json
      - name: Run fixed seven-day diagnostic
        run: >-
          python -m research.flow_lab.multi_day_study
          --start 2026-09-13
          --end 2026-09-19
          --assets BTC ETH
          --window-sec 30
          --extreme-percentile 0.99
          --output results/flow_lab/multiday.json
      - name: Print compact results
        run: |
          python - <<'PY'
          import json
          for path in ('results/flow_lab/pilot.json', 'results/flow_lab/multiday.json'):
              d=json.load(open(path))
              print('\n###', path)
              for r in d['results']:
                  print(r['symbol'], 'events=', r['event_count'], 'classes=', r['response_class_counts'])
                  for g in r['groups']:
                      if g['response_class']=='absorption_candidate':
                          print(' absorption', g['flow_side'], 'n=', g['n'],
                                '5m reversal=', g.get('h10_mean_reversal_bps'),
                                'rate=', g.get('h10_reversal_positive_rate'),
                                '15m reversal=', g.get('h30_mean_reversal_bps'),
                                'rate=', g.get('h30_reversal_positive_rate'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-lab-pilot
          path: |
            results/flow_lab/pilot.json
            results/flow_lab/multiday.json
          if-no-files-found: error
