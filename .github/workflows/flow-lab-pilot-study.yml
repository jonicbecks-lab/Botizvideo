name: Flow Lab Pilot Study

on:
  push:
    branches:
      - research/multivenue-flow-btc-eth-v1
    paths:
      - 'research/flow_lab/archive_study.py'
      - 'research/flow_lab/historical.py'
      - '.github/workflows/flow-lab-pilot-study.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/flow_lab/requirements.txt
      - name: Run fixed pilot
        run: >-
          python -m research.flow_lab.archive_study
          --date 2026-09-20
          --assets BTC ETH
          --window-sec 30
          --extreme-percentile 0.99
          --output results/flow_lab/pilot.json
      - name: Print result
        run: cat results/flow_lab/pilot.json
      - uses: actions/upload-artifact@v4
        with:
          name: flow-lab-pilot
          path: results/flow_lab/pilot.json
          if-no-files-found: error
